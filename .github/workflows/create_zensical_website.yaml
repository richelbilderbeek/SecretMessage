# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
name: Create Zensical website

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/create_zensical_website.yaml
      - 'docs/**'
      - 'wasm/**'
      - zensical.toml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  create_zensical_website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build WebAssembly version
        run: |
          emcc -O2 wasm/secretmessage_wasm.cpp -o docs/run/secretmessage.js \
            -s MODULARIZE=1 -s EXPORT_NAME=createSecretMessageModule \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS=_malloc,_free,_get_result_width,_get_result_height,_create_secret_message,_extract_secret_message \
            -s EXPORTED_RUNTIME_METHODS=HEAPU8
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
